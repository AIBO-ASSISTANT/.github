name: Reusable Python Engine CI

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  python-tests:
    name: Python engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
            python -m pip install pytest pytest-asyncio anyio httpx mypy build
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            python -m pip install pytest pytest-asyncio anyio httpx
          else
            python -m pip install fastapi pydantic uvicorn pytest pytest-asyncio
          fi

      - name: Run typecheck
        shell: bash
        run: |
          if command -v mypy &> /dev/null && [ -d src ]; then
            mypy src || true
          fi

      - name: Run tests
        shell: bash
        run: |
          if command -v pytest &> /dev/null; then
            pytest tests/ -v
          else
            python -m unittest discover -s tests
          fi
