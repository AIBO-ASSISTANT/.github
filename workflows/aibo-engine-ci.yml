name: AIBO-ENGINE-V1.0 CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "AIBO-ENGINE-V1.0/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "AIBO-ENGINE-V1.0/**"
  workflow_dispatch:

jobs:
  engine-v1:
    name: AIBO-ENGINE-V1.0 Test & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AIBO-ENGINE-V1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-asyncio anyio httpx mypy build

      - name: Run mypy type checking
        run: |
          mypy src

      - name: Run pytest test suite (606 tests)
        run: |
          pytest tests/ -v

      - name: Verify package build
        run: |
          python -m build --sdist --wheel
