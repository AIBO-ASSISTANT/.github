name: AIBO-ENGINE CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "AIBO-ENGINE/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "AIBO-ENGINE/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AIBO-ENGINE

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest mypy anyio httpx

    - name: Run mypy strict type checking
      run: |
        mypy src tests transport api.py

    - name: Run pytest
      run: |
        pytest
